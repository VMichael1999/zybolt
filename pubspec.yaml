name: zybolt
description: "Zybolt: envíos y seguimiento de paquetes en tu ciudad."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  equatable: ^2.0.5
  go_router: ^14.0.0
  get_it: ^8.0.0
  flutter_svg: ^2.0.10
  google_maps_flutter: ^2.18.1
  flutter_dotenv: ^6.0.1
  vector_graphics: ^1.3.1
  liquid_glass_widgets: ^1.17.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
